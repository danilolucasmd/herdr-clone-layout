name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # The plugin is POSIX sh, so lint it as such rather than as bash.
      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck --shell=sh bin/clone-layout bin/clone-layout-dialog \
            tests/run.sh tests/known.sh tests/prompt.sh tests/keys.sh tests/apps.sh

      - name: Manifest is valid TOML
        run: python3 -c "import tomllib,sys; tomllib.load(open('herdr-plugin.toml','rb'))"

      - name: plan.jq parses
        run: jq -n --argjson snap '{"tabs":[],"layouts":[]}' --arg ws w1 -f lib/plan.jq

      # The geometry analysis, against fixture snapshots. No herdr server needed.
      - name: Tests
        run: ./tests/run.sh

      # The guard that decides whether a workspace is new or merely emptied.
      - name: Populated-workspace history tests
        run: ./tests/known.sh

      # Which new workspaces get the dialog, how it reads paths, and what the
      # remembered checkbox does to the hook.
      - name: Dialog routing tests
        run: ./tests/prompt.sh

      # The popup itself, driven by its keys. No tty needed: the keys arrive on
      # stdin and a stub herdr stands in for the session.
      - name: Dialog key tests
        run: ./tests/keys.sh

      # Reading a command out of a pane's process tree and typing it into the
      # pane that was cloned from it.
      - name: Reopen-apps tests
        run: ./tests/apps.sh
