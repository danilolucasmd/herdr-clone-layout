id = "herdr-clone-layout"
name = "Clone Layout"
version = "0.6.1"
min_herdr_version = "0.7.0"
description = "Every new workspace/worktree inherits the tab + pane-split geometry of the workspace you were just in (geometry only — panes open as bare shells)."
platforms = ["linux", "macos"]

# CLI worktree/workspace creation emits worktree.created / workspace.created;
# the in-app "new worktree/workspace" emits only workspace.focused (it focuses
# the new one on creation). Subscribe to all three; the handler dedupes with an
# atomic claim and only ever populates a fresh (1-tab/1-pane) workspace.
[[events]]
on = "workspace.focused"
command = ["sh", "bin/clone-layout", "event"]

[[events]]
on = "workspace.created"
command = ["sh", "bin/clone-layout", "event"]

[[events]]
on = "worktree.created"
command = ["sh", "bin/clone-layout", "event"]

# The popup a new workspace or worktree gets: clone the layout as-is, clone it
# with every pane opened in a directory you choose, or — with the first of the two
# checkboxes unticked — don't clone at all, now or for the next one. The second
# decides whether the panes reopen what they were running. A worktree is asked
# only the first of those — its directory was settled when the checkout was made —
# and cancelling never removes the checkout.
[[panes]]
id = "choose-layout"
title = "clone layout"
placement = "popup"
width = 66
height = 16
command = ["sh", "bin/clone-layout-dialog"]

# Manual: duplicate the current workspace's geometry into a brand-new workspace.
[[actions]]
id = "apply"
title = "Duplicate workspace layout"
contexts = ["workspace"]
command = ["sh", "bin/clone-layout", "apply"]

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "herdr-clone-layout.apply"
description = "duplicate workspace layout into a new workspace"
